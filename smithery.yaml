# Smithery configuration file: https://smithery.ai/docs/build/project-config

runtime: container
startCommand:
  type: http
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { WIKI_SERVER: config.wikiServer, ARTICLE_PATH: config.articlePath, SCRIPT_PATH: config.scriptPath, BASIC_AUTH_USERNAME: config.basicAuthUsername, BASIC_AUTH_PASSWORD: config.basicAuthPassword, WIKI_USERNAME: config.wikiUsername, WIKI_PASSWORD: config.wikiPassword } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    properties:
      wikiServer:
        type: string
        description: Domain of the wiki, e.g. https://en.wikipedia.org
      articlePath:
        type: string
        description: Article path of the wiki, e.g. /wiki
      scriptPath:
        type: string
        description: Script path of the wiki, e.g. /w
      basicAuthUsername:
        type: string
        description: Username for basic HTTP authentication
      basicAuthPassword:
        type: string
        description: Password for basic HTTP authentication
      wikiUsername:
        type: string
        description: MediaWiki username for API authentication
      wikiPassword:
        type: string
        description: MediaWiki password for API authentication
  exampleConfig:
    wikiServer: https://en.wikipedia.org
    articlePath: /wiki
    scriptPath: /w
    basicAuthUsername: basic-user
    basicAuthPassword: basic-password
    wikiUsername: wiki-user
    wikiPassword: wiki-password
